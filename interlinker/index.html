<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Universal Interlinker</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#17283b;font:16px/1.55 system-ui}header{background:#11263a;color:white;padding:20px 30px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}header strong{font-size:22px}header span{color:#b6d1df}main{max-width:1280px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,input,select{font:inherit;padding:10px 14px;border:1px solid #c5d1db;border-radius:7px}button{cursor:pointer;background:white;color:#163c52}button.primary{background:#006b66;color:white;border-color:#006b66}button:disabled{opacity:.5;cursor:wait}button.active{background:#163c52;color:white}input{min-width:0}form,.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.card{background:white;border:1px solid #dbe3e9;border-radius:10px;padding:22px;margin:16px 0}.muted{color:#53687a;font-size:14px}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px}.metric{padding:22px;background:white;border-radius:10px}.metric b{display:block;font-size:32px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e0e7ed;overflow-wrap:anywhere}a{color:#006b66}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf4f6;padding:16px;font-size:14px}.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.error{color:#a51f2b}.score{font-size:26px;font-weight:700;color:#006b66}.row{display:flex;justify-content:space-between;gap:20px;align-items:center}.tablewrap{overflow:auto}#notice{min-height:28px}svg{width:100%;height:520px;background:white;border:1px solid #dbe3e9}label{display:inline-flex;gap:8px;align-items:center}@media(max-width:700px){main{padding:14px}.diff{grid-template-columns:1fr}.row{align-items:flex-start;flex-direction:column}header{padding:18px}}
</style><header><strong>Universal Interlinker</strong><span>0.2 · Локальная проверка ссылок</span></header><main>
<div class="toolbar"><label>Сайт <select id="site" aria-label="Сайт"></select></label><button id="scan">Сканировать до 25 URL</button><button class="primary" id="generate">Найти рекомендации</button><button id="database">Загрузить из MySQL</button><button id="import">Загрузить статьи из репозитория</button></div>
<form id="add" style="margin-top:14px"><input id="url" type="url" placeholder="https://itpotok.ru" aria-label="URL нового сайта" required><button>Добавить сайт</button></form>
<p class="muted">Read-only: изменения на WordPress не публикуются. LSA — экспериментальная семантика; каждое предложение требует проверки. Orphan означает отсутствие входящих ссылок в загруженной части сайта.</p>
<nav id="nav"></nav><div id="notice" role="status" aria-live="polite"></div><section id="view"></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let site=null,tab='Обзор',timer=null;
async function api(path,body){const r=await fetch('/api'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(typeof d.detail==='string'?d.detail:JSON.stringify(d.detail));return d}
function notice(t,error=false){$('#notice').textContent=t;$('#notice').className=error?'error':''}
async function action(fn){try{await fn()}catch(e){notice(e.message,true)}}
const tabs=['Обзор','Страницы','Рекомендации','Граф','SEO-приоритеты','Настройки','История'];
function navigation(){$('#nav').innerHTML=tabs.map(t=>`<button class="${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');$('#nav').onclick=e=>{if(e.target.dataset.tab){tab=e.target.dataset.tab;navigation();action(render)}}}
async function loadSites(){const data=await api('/sites');$('#site').innerHTML=data.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(!data.some(s=>s.id===site))site=data[0]?.id??null;$('#site').value=site??'';await render()}
$('#site').onchange=()=>{site=Number($('#site').value);action(render)};
$('#add').onsubmit=e=>{e.preventDefault();action(async()=>{await api('/sites',{url:$('#url').value});await loadSites();notice('Сайт добавлен')})};
$('#database').onclick=()=>action(async()=>{notice('Читаю базу сайта…');const r=await api('/import-database',{});await loadSites();notice(`Загружено из MySQL: ${r.imported}`)});
$('#import').onclick=()=>action(async()=>{notice('Загружаю статьи…');const r=await api('/import',{});await loadSites();notice(`Загружено страниц: ${r.imported}`)});
async function job(kind){if(!site)return notice('Добавьте сайт',true);const id=site;await api(`/sites/${id}/jobs/${kind}`,{});notice('Обработка запущена…');clearInterval(timer);timer=setInterval(()=>action(async()=>{const jobs=await api(`/sites/${id}/jobs`);const j=jobs[0];if(j&&['completed','failed'].includes(j.status)){clearInterval(timer);notice(j.status==='failed'?j.error:`Готово. Сохранено: ${j.stored}. ${j.error&&j.error!=='[]'?j.error:''}`,j.status==='failed');if(site===id)await render()}}),2000)}
$('#scan').onclick=()=>action(()=>job('crawl'));$('#generate').onclick=()=>action(()=>job('generate'));
function table(headers,rows){return `<div class="card tablewrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table></div>`}
async function render(){if(!site){$('#view').innerHTML='<div class="card">Добавьте сайт или загрузите существующие статьи, чтобы начать работу.</div>';return}const prefix=`/sites/${site}`;
if(tab==='Обзор'){const [g,r,j]=await Promise.all([api(prefix+'/graph'),api(prefix+'/recommendations'),api(prefix+'/jobs')]);const n=g.nodes;$('#view').innerHTML='<div class="metrics">'+[['Страниц',n.length],['Связей в графе',g.edges.length],['Рекомендаций',r.filter(x=>x.status==='pending').length],['Без входящих',n.filter(x=>x.orphan).length],['Слабых страниц',n.filter(x=>x.weak).length]].map(([t,v])=>`<div class="metric"><span>${t}</span><b>${v}</b></div>`).join('')+'</div>'+table(['Последние задания','Статус','Сохранено','Ошибка'],j.map(x=>[esc(x.created),esc(x.status),x.stored,esc(x.error??'')]));}
if(tab==='Страницы'){const g=await api(prefix+'/graph');$('#view').innerHTML=table(['Страница','Входящие страницы','Исходящие ссылки','PageRank','Глубина'],g.nodes.map(p=>[`<a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.title)}</a>`,p.incoming,p.outgoing,p.pagerank.toFixed(4),p.depth??'Не определена']));}
if(tab==='Рекомендации'){$('#view').innerHTML='<div class="toolbar"><input id="query" placeholder="URL или заголовок" aria-label="Поиск"><label>Статус <select id="status"><option value="">Все</option><option value="pending">На проверке</option><option value="approved">Одобрено</option><option value="rejected">Отклонено</option></select></label><label>Score от <input id="minimum" type="number" value="0" min="0" max="100" style="width:85px"></label><button id="filter">Показать</button></div><div id="recs"></div>';
async function list(){const r=await api(prefix+`/recommendations?query=${encodeURIComponent($('#query').value)}&status=${$('#status').value}&minimum=${$('#minimum').value||0}`);$('#recs').innerHTML=r.length?r.map(x=>`<article class="card"><div class="row"><div><b>${esc(x.source_title)}</b><p>→ ${esc(x.target_title)}</p></div><div><span class="score">${x.score.toFixed(1)}</span><br>${esc(x.status)}</div></div><p>${esc(x.original_text)}</p><p>Анкор: <b>${esc(x.anchor)}</b> · <a href="${esc(x.target)}" target="_blank" rel="noopener noreferrer">Целевая страница</a></p><details><summary>HTML до / после и объяснение</summary><div class="diff"><div>До<pre>${esc(x.old_html)}</pre></div><div>После<pre>${esc(x.new_html)}</pre></div></div><pre>${esc(JSON.stringify(x.components,null,2))}</pre></details><div class="toolbar"><button data-id="${x.id}" data-status="approved" class="primary">Принять</button><button data-id="${x.id}" data-status="rejected">Отклонить</button><button data-id="${x.id}" data-status="pending">Вернуть на проверку</button></div></article>`).join(''):'<div class="card">Нет предложений. Проверьте настройки или запустите поиск. Отсутствие ссылок при слабом совпадении — нормальный результат.</div>'}
$('#filter').onclick=()=>action(list);$('#recs').onclick=e=>{if(e.target.dataset.id)action(async()=>{await api(`/recommendations/${e.target.dataset.id}/review`,{status:e.target.dataset.status});await list()})};await list();}
if(tab==='Граф'){const g=await api(prefix+'/graph');const ns=g.nodes.slice(0,100),pos=new Map(ns.map((n,i)=>[n.url,{x:500+Math.cos(i/ns.length*2*Math.PI)*420,y:260+Math.sin(i/ns.length*2*Math.PI)*210}]));$('#view').innerHTML='<p>До 100 страниц. Наведите на узел для названия. Красный — без входящих ссылок.</p><svg viewBox="0 0 1000 520" role="img" aria-label="Граф существующих внутренних ссылок">'+g.edges.filter(e=>pos.has(e.source)&&pos.has(e.target)).map(e=>{const a=pos.get(e.source),b=pos.get(e.target);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#b2c4d2"/>`}).join('')+ns.map(n=>{const a=pos.get(n.url);return `<circle cx="${a.x}" cy="${a.y}" r="${6+Math.min(12,n.pagerank*150)}" fill="${n.orphan?'#b9393f':'#006b66'}"><title>${esc(n.title)}: входящих ${n.incoming}</title></circle>`}).join('')+'</svg>';}
if(tab==='SEO-приоритеты'){$('#view').innerHTML='<form id="priority" class="card"><label>Правило <select id="kind"><option value="url">URL</option><option value="directory">Директория</option><option value="category">ID категории</option></select></label><input id="value" required placeholder="https://site.ru/category/" aria-label="Значение"><label>Вес <input id="weight" type="number" min="0" max="5" value="3"></label><label><input type="checkbox" id="blocked">Запретить</label><button>Сохранить</button></form><p class="muted">Бонус до 5 баллов добавляется только после порога релевантности. Запрет действует при следующей генерации.</p><div id="rules"></div>';const r=await api(prefix+'/priorities');$('#rules').innerHTML=table(['Тип','Значение','Вес','Запрет'],r.map(x=>[esc(x.kind),esc(x.value),x.weight,x.blocked?'Да':'Нет']));$('#priority').onsubmit=e=>{e.preventDefault();action(async()=>{await api(prefix+'/priorities',{kind:$('#kind').value,value:$('#value').value,weight:Number($('#weight').value),blocked:$('#blocked').checked});await render()})}}
if(tab==='Настройки'){const s=await api(prefix+'/settings');$('#view').innerHTML=`<form class="card" id="settings"><label>Семантика <select id="provider"><option value="lsa">LSA: экспериментальный baseline</option><option value="minilm">MiniLM: нейросетевые embeddings</option><option value="ollama">Ollama: qwen3-embedding:0.6b</option></select></label><label>Минимальный score <input id="score" type="number" min="0" max="100" value="${s.minimum_score}"></label><label>Ссылок на страницу <input id="max" type="number" min="1" max="10" value="${s.max_per_page}"></label><label>Повторов анкора <input id="repeat" type="number" min="1" max="20" value="${s.anchor_repetition_limit}"></label><label><input id="citymode" type="checkbox" ${s.city_mode?"checked":""}>Городские названия и тип страницы</label><label><input id="contextual" type="checkbox" ${s.contextual?"checked":""}>Контекстная проверка Ollama qwen3:8b</label><button>Сохранить</button></form><p>Для Ollama нужна локально запущенная модель. При её недоступности будет ошибка; скрытого переключения на LSA нет. Контекстная проверка включается отдельно; без модели используйте режим preview. Для MiniLM установите requirements-benchmark.txt.</p>`;$('#provider').value=s.provider;$('#settings').onsubmit=e=>{e.preventDefault();action(async()=>{await api(prefix+'/settings',{city_mode:$('#citymode').checked,contextual:$('#contextual').checked,confidence_threshold:.85,provider:$('#provider').value,minimum_score:Number($('#score').value),max_per_page:Number($('#max').value),anchor_repetition_limit:Number($('#repeat').value)});notice('Настройки сохранены')})}}
if(tab==='История'){const h=await api(prefix+'/history');$('#view').innerHTML=table(['Дата','Предложение','Действие'],h.map(x=>[esc(x.created),x.recommendation_id,esc(x.action)]))}
}
navigation();action(loadSites);
</script></html>
